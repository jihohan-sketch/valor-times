<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" width="1600" height="1067" role="img">
  <defs>
    
    <!-- Paper tooth. Plain alpha compositing only: mix-blend-mode inside an SVG
         blends against a transparent backdrop when used in an <img>. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    </filter>
  </defs>
  <g><rect width="1600" height="1067" fill="#D81E26"/><rect x="0" y="0" width="1248" height="162.68473855173497" fill="#FFFFFF"/><rect x="128" y="236.15526563961527" width="1472" height="178.9995079632085" fill="#A0141A"/><rect x="0" y="495.9932610700792" width="1248" height="171.24614094905647" fill="#FFFFFF"/><rect x="128" y="744.5763688993547" width="1472" height="84.9529095948115" fill="#FFFFFF"/><rect x="0" y="867.8951086337586" width="1248" height="113.45698496167643" fill="#A0141A"/><rect x="832" y="211.81002545109016" width="640" height="490.82" fill="#111114"/></g>
  <rect width="1600" height="1067" filter="url(#grain)" opacity="0.07"/>
</svg>