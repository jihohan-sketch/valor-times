<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" width="1600" height="1067" role="img">
  <defs>
    
    <!-- Paper tooth. Plain alpha compositing only: mix-blend-mode inside an SVG
         blends against a transparent backdrop when used in an <img>. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    </filter>
  </defs>
  <g>
    <rect width="1600" height="1067" fill="#111114"/>
    <path d="M0 453.4534449552373 L1600 145.92730202698615 L1600 1067 L0 1067 Z" fill="#FBFAF8"/>
    <circle cx="389.89947132766247" cy="388.264848713614" r="214.03327637244016" fill="#F0333B"/>
    <rect x="96" y="789.58" width="935.9520008862019" height="12" fill="#F0333B"/>
    <rect x="96" y="853.6" width="401.21516466140747" height="12" fill="#111114" opacity="0.5"/></g>
  <rect width="1600" height="1067" filter="url(#grain)" opacity="0.07"/>
</svg>