<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" width="1600" height="1067" role="img">
  <defs>
    
    <!-- Paper tooth. Plain alpha compositing only: mix-blend-mode inside an SVG
         blends against a transparent backdrop when used in an <img>. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    </filter>
  </defs>
  <g><rect width="1600" height="1067" fill="#FBFAF8"/><rect x="0" y="0" width="1248" height="139.81890642983186" fill="#111114"/><rect x="128" y="202.9629286884656" width="1472" height="75.22279724435136" fill="#E8E4DE"/><rect x="0" y="312.1573117851047" width="1248" height="185.09283529398496" fill="#111114"/><rect x="128" y="580.8404597925023" width="1472" height="67.94940168652498" fill="#111114"/><rect x="0" y="679.4766880471353" width="1248" height="147.58394433065595" fill="#E8E4DE"/><rect x="832" y="309.10623625651" width="640" height="490.82" fill="#D81E26"/></g>
  <rect width="1600" height="1067" filter="url(#grain)" opacity="0.07"/>
</svg>