<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" width="1600" height="1067" role="img">
  <defs>
    
    <!-- Paper tooth. Plain alpha compositing only: mix-blend-mode inside an SVG
         blends against a transparent backdrop when used in an <img>. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    </filter>
  </defs>
  <g>
    <rect width="1600" height="1067" fill="#F3EFE8"/>
    <path d="M0 465.5005227094516 L1600 192.14142732761331 L1600 1067 L0 1067 Z" fill="#111114"/>
    <circle cx="838.0195331573485" cy="389.6678489967063" r="153.75638344477863" fill="#D81E26"/>
    <rect x="96" y="789.58" width="972.537449270487" height="12" fill="#D81E26"/>
    <rect x="96" y="853.6" width="469.2982758283615" height="12" fill="#F3EFE8" opacity="0.5"/></g>
  <rect width="1600" height="1067" filter="url(#grain)" opacity="0.07"/>
</svg>